{
  "slides": [
    {
      "sceneId": "cover",
      "notes": "**Алишер:** Проект продолжает midterm и endterm: оценивает цену предложения подержанного автомобиля в Казахстане по характеристикам объявления. Тема и исходный датасет сохранены.\n\n**Аслан:** В Final объединены результаты, обзор исследований и предложение следующего исследования. Target — цена, которую указал продавец, в тенге. Мы не располагаем подтверждёнными ценами сделок.",

    {
      "sceneId": "question",
      "notes": "**Алишер:** Исследовательский вопрос: насколько точно характеристики автомобиля позволяют оценить цену предложения в этом снимке рынка? Практическое применение — исторический ориентир для сравнения объявлений. Работа Barlybayev и коллег показывает, что похожая задача уже исследовалась на данных Казахстана, но у них другой набор наблюдений.\n\n**Аслан:** С midterm сохранён критерий: MAE минимум на 20% ниже прогноза медианой обучающей выборки. MAE измеряет среднюю абсолютную ошибку в тенге. Дополнительно нужны RMSE, R² и относительные ошибки, поскольку они отражают разные свойства прогноза.",

      "endTime": 40

    {
      "sceneId": "data",
      "notes": "Источник — Kolesa-Cars-2025 на Kaggle. В оригинале 3 999 строк и 14 столбцов. Удалены 527 новых автомобилей, 51 подержанный автомобиль под заказ и 868 повторных ID оставшихся объявлений. Получено 2 553 объявления о подержанных автомобилях. Исходный CSV и цены сохранены; синтетических наблюдений нет.\n\nВ 497 строках отсутствует пробег. Нет индивидуальных дат объявлений, VIN, структурированного местоположения и проверенного технического состояния. Поэтому дубли одного автомобиля с разными ID исключить полностью нельзя. Хеш исходного файла проверяется загрузчиком.",
      "startTime": 40,
      "endTime": 60
    },
    {
      "sceneId": "eda-price",
      "notes": "EDA строится только по TRAIN. У распределения цены длинный правый хвост: среднее около 9,53 млн тенге, медиана 6,70 млн. Дорогие автомобили сильно влияют на squared error, поэтому дополнительно рассматриваются MAE и относительные ошибки.\n\nНа графике года показаны медианные цены для лет с минимум восемью наблюдениями. Корреляция Спирмена между годом и ценой около 0,69. Связь описательная: она не измеряет причинное обесценивание одного автомобиля, потому что одновременно отличаются марки, комплектации и другие свойства.",
      "startTime": 60,
      "endTime": 80

    {
      "sceneId": "eda-mileage",
      "notes": "Для известного пробега корреляция с ценой около −0,53, но разброс большой. Scatter использует воспроизводимую выборку максимум из 1 200 TRAIN строк с известным пробегом. Один пробег не определяет стоимость.\n\nГрафик топлива показывает все TRAIN наблюдения на логарифмической оси цены. Малые группы, например электромобили, не дают оснований для широких выводов о рынке. Различия могут отражать состав моделей. Нулевой флаг оборудования означает, что положительное утверждение не обнаружено в тексте, а не то, что оборудования точно нет.",
      "startTime": 80,
      "endTime": 100
    },
    {
      "sceneId": "protocol",
      "notes": "**Алишер:** Split фиксирован: 1 787 TRAIN, 383 validation и 383 исторических test. Одинаковые ID объявлений не пересекаются. Пропущенный пробег и неприменимый объём двигателя электромобиля различаются. Топливо и руль извлекаются по явным формулировкам. Возраст считается относительно снимка 2025 года. Пробег, делённый на возраст, — математический proxy, а не измеренная история эксплуатации.\n\n**Аслан:** Imputer, scaler, encoder и преобразование target обучаются только на TRAIN. В CV они заново обучаются внутри каждого fold. Но прежние ошибки test уже влияли на разработку признаков, а validation использовался многократно. Поэтому test — retrospective benchmark. Этот запуск воспроизводит зафиксированную систему; независимую будущую точность он не доказывает.",
      "startTime": 100,
      "endTime": 120
    },
    {
      "sceneId": "supervised",
      "notes": "Сохранены медианный baseline, Linear Regression, исходный KNN с 15 соседями и дерево глубины 10 с минимумом 3 объекта в листе. Для новых KNN, Tree и Random Forest используется одинаковая трёхфолдовая CV только внутри TRAIN, shuffle и seed 42. Критерий подбора — отрицательная MAE в тенге, то есть максимизация score эквивалентна минимизации ошибки.\n\nВыбраны KNN с 5 соседями, Manhattan distance и distance weighting; дерево глубины 10 с leaf size 3; RF с 200 деревьями, max_features 0,7 и leaf size 1. CV MAE леса около 2,17 млн. Разброс по folds — стандартное отклонение, не доверительный интервал. Сравниваются целые pipelines с различающимися признаками.",
      "startTime": 120,
      "endTime": 140
    },
    {
      "sceneId": "clusters",
      "notes": "K-Means использует год, log пробега и очищенный объём двигателя. Из этой геометрии исключены 12 электрических TRAIN автомобилей: объём двигателя для них неприменим. В supervised learning они сохранены. Остаётся 1 775 строк.\n\nПосле TRAIN median imputation и StandardScaler проверены k от 2 до 8. Максимальный silhouette около 0,369 при k=4. Профили отражают относительно новые автомобили с небольшим пробегом, старые автомобили и различия объёма двигателя. Цена добавлена после fitting для описания групп. Категории марки/модели не участвуют; устойчивость кластеров отдельно не исследована. Поэтому это геометрические группы выбранных признаков.",
      "startTime": 140,
      "endTime": 160
    },
    {
      "sceneId": "pca",
      "notes": "На экране все 1775 неэлектрических TRAIN-объявлений в координатах PC1, PC2 и PC3. Мышью можно вращать систему, колёсиком менять масштаб, Reset view возвращает исходный ракурс. В режиме P ракурс синхронизируется с аудиторией. Три компоненты сохраняют 100% дисперсии трёх входов; кнопка PC1 / PC2 показывает двумерную проекцию с 80,13%.\n\nPCA обучена на 1775 неэлектрических TRAIN-объявлениях. Три входа: год, log(1 + пробег) и объём двигателя. Пропуски заполнены TRAIN-медианами, затем признаки стандартизованы на TRAIN. Цвета — группы KMeans, обученные в исходном пространстве этих трёх входов. Обучены три компоненты. PC1 объясняет 47,67%, PC2 — 32,46%, вместе 80,13%. В режиме PC1 / PC2 оставлены две; потеря составляет 19,87% вариации этих входов.\n\nPC1 противопоставляет более новый год большему пробегу. PC2 главным образом связан с объёмом двигателя. Loadings здесь — коэффициенты единичных направлений, а не корреляции. Знак компоненты может поменяться без изменения смысла. PCA помогает увидеть структуру; её explained variance не означает долю объяснённой цены или улучшение регрессии.",
      "startTime": 160,
      "endTime": 180
    },
    {
      "sceneId": "ann",
      "notes": "ANN — feedforward MLP с ReLU в скрытых слоях и линейным выходом. Adam, learning rate 0,001, L2 alpha 0,001, batch 64. Target — стандартизованный log1p цены. После inverse transform прогноз оценивается в тенге. Loss при обучении в log scale и MAE в деньгах — разные цели.\n\nСравниваются архитектуры 64–32 и 128–64. Большая сеть выбрана по минимальной validation MAE на эпохе 71. Всего 111 эпох: после лучшей ещё 40 без улучшения, затем остановка с восстановлением checkpoint.\n\nTrain MAE выбранного checkpoint — 0,768 млн, validation MAE — 2,371 млн. Разрыв существенный. Условный сигнал ухудшения validation более чем на 5% не сработал: ухудшение около 2,50%. Это не доказательство отсутствия overfitting. Истории обеих архитектур сохранены.",
      "startTime": 180,
      "endTime": 200
    },
    {
      "sceneId": "comparison",
      "notes": "График содержит все девять моделей и одинаковые validation/test ID. Признаки различаются, поэтому нельзя приписать всю разницу только алгоритму. Ансамбль имеет минимальную test MAE: 1,635 млн тенге, на 72,53% ниже медианы и на 33,09% ниже исходного KNN.\n\nТюнинг не гарантирует улучшения: новые KNN и Tree на историческом test хуже исходных по MAE. Одиночная ANN лучше ансамбля по RMSE и R², а RF — по median APE. Основная цель проекта — MAE, поэтому сохранён ансамбль.\n\nValidation содержит объявление за 222 млн, максимум test — 93,5 млн. Разница хвостов влияет на RMSE и R²: у ансамбля validation R² около 0,391, test около 0,917. Это требует осторожной интерпретации и независимой проверки, а не вывода о гарантированной рыночной точности.\n\nЭто ретроспективное сравнение: исторический test уже использовался в разработке, поэтому он не является новой независимой проверкой. Сохранён ранее выбранный замороженный рецепт ансамбля; нового поиска по test не проводилось.\n\nРецепт сохранённого ансамбля: 0.25 × usage-MAE pool + 0.75 × (0.75 × corrected-dual pool + 0.25 × random forest), суммарно десять нейросетей и RF. В этом запуске веса не подбирались заново.",
      "startTime": 200,
      "endTime": 220
    },
    {
      "sceneId": "errors",
      "notes": "Ценовые границы 3,6 / 6,7 / 11,5 млн определены по TRAIN. На test в верхней группе MAE около 4,09 млн, в нижней 0,78 млн. Средний residual верхней группы положителен: actual минус prediction показывает недооценку.\n\nДля моделей автомобилей, которых не было в TRAIN, MAE 3,59 млн при 42 строках; при минимум пяти обучающих примерах — 1,33 млн. В электрической группе лишь три test автомобиля, поэтому её большая ошибка не даёт устойчивой общей оценки.\n\nТолько 224 из 383 прогнозов попадают в ±20% цены. Высокий R² не означает, что 92% отдельных прогнозов точны.",
      "startTime": 220,
      "endTime": 240
    },
    {
      "sceneId": "literature",
      "notes": "**Алишер:** Обзор включает Казахстан и исследования других рынков. Barlybayev и коллеги дают местный контекст, Gollapalli и коллеги сравнивают линейные и древесные модели. Sharma и Mitra изучают нелинейные зависимости, Bergmann и Feuerriegel — значение подробной комплектации.\n\n**Аслан:** Работа Cui использует другую нейросетевую и boosting схему; её результат не подтверждает автоматически наш fixed average. Общие исследования tabular learning мотивируют сильные tree baselines рядом с ANN. Сравнивать опубликованные MAE напрямую нельзя: различаются валюта, target, фильтрация и выборки. Главный оставшийся вопрос — сохранится ли наше ранжирование на новых независимых объявлениях Казахстана.",
      "startTime": 240,
      "endTime": 260
    },
    {
      "sceneId": "proposal",
      "notes": "**Алишер:** Это план будущей работы. Исходный датасет остаётся development data. Нужен независимый снимок с записанными датами и разрешённым способом получения. Ориентир 800–1 200 уникальных подходящих объявлений — организационная цель, не расчёт статистической мощности. До оценки фиксируются правила отбора и проверки повторных автомобилей.\n\n**Аслан:** До просмотра независимых цен замораживаются модели, преобразования и основная проверка разницы MAE ансамбля и медианы. Сравниваются сохранённые ансамбль, одиночная ANN, RF и медианный baseline на одинаковых новых строках. Историческая таблица девяти моделей остаётся отдельно. Новый тюнинг — отдельный development-эксперимент. Далее bootstrap по группам автомобилей при надёжной идентификации, counts подгрупп и анализ distribution shift. План на шесть недель: протокол и разрешения; две недели сбора и проверки; фиксация и оценка; неопределённость; отчёт. Отсутствие убедительного преимущества ансамбля тоже будет результатом.",
      "startTime": 260,
      "endTime": 280
    },
    {
      "sceneId": "conclusion",
      "notes": "Итог: MAE сохранённого ансамбля на историческом test — 1,635 млн тенге, на 72,53% ниже TRAIN-медианы. Это ретроспективное сравнение; для вывода о будущих данных нужна независимая проверка.\n\nАлишер: dataset sourcing, cleaning, feature engineering, EDA, K-Means and PCA. Аслан: supervised models, CV, ANN and ensemble, metrics, error analysis and reproducibility. Распределение ролей совпадает с endterm.",
      "startTime": 280,
      "endTime": 300
    },
    {
      "sceneId": "thanks",
      "notes": "Завершение выступления и переход к вопросам.",
      "startTime": 300,
      "endTime": 320,
      "autoplay": true
    }
  ]
}

  <script>
    (function () {
      var slideshow = document.querySelector("hyperframes-slideshow");
      var player = slideshow.querySelector("hyperframes-player");
      // Native autoplay's video lookup uses the parent HTMLVideoElement realm.
      // Its iframe video therefore fails instanceof. Keep native lifecycle,
      // correcting only that same-origin lookup for this standalone harness.
      slideshow.findSceneVideo = function (sceneId) {
        var frame = player.iframeElement;
        var doc = frame && frame.contentDocument;
        if (!doc) return null;
        var scenes = Array.from(doc.querySelectorAll("[data-composition-id]"));
        var scene = scenes.find(function (el) {return el.getAttribute("data-composition-id") === sceneId;});
        return scene ? scene.querySelector("video") : null;
      };
      if (new URLSearchParams(location.search).get("mode") === "audience") document.title = "ML Final — Audience";
      function focusDeck(event) {
        var target = event && event.target;
        if (target && target.closest && target.closest("button,a,input,textarea,select,[contenteditable=true]")) return;
        if (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
        slideshow.focus({preventScroll:true});
      }
      window.addEventListener("load",function () {focusDeck();});
      document.addEventListener("pointerdown",focusDeck);
      window.PILOT_SHELL = {slideshow:slideshow,player:player};
    })();
  </script>
