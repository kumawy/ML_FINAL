<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-labelledby="title desc">
  <title id="title">From a used-car listing to an asking-price estimate</title>
  <desc id="desc">Listing features are passed through an ANN and random forest regression ensemble to estimate the advertised asking price in Kazakhstani tenge.</desc>
  <rect width="1200" height="168" rx="12" fill="#101317"/>
  <path d="M24 144H1176" stroke="#b5e9f4" stroke-opacity=".1"/>
  <g fill="none" stroke="#b5e9f4" stroke-opacity=".3">
    <path d="M342 84H428m-8-6 8 6-8 6M772 84H858m-8-6 8 6-8 6"/>
    <rect x="28" y="28" width="314" height="112" rx="4"/>
    <rect x="428" y="28" width="344" height="112" rx="4"/>
    <rect x="858" y="28" width="314" height="112" rx="4"/>
  </g>
  <g fill="#b5e9f4" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">
    <text x="52" y="53">01 / INPUT</text>
    <text x="452" y="53">02 / MODEL</text>
    <text x="882" y="53">03 / ESTIMATE</text>
  </g>
  <g fill="#edf3f4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">
    <text x="52" y="87">Listing features</text>
    <text x="452" y="87">Regression ensemble</text>
    <text x="882" y="87">Asking price</text>
  </g>
  <g fill="#a5b1b9" font-family="Arial, Helvetica, sans-serif" font-size="17">
    <text x="52" y="115">Used-car characteristics</text>
    <text x="452" y="115">ANN + random forest</text>
    <text x="882" y="115">Kazakhstani tenge / KZT</text>
  </g>
</svg>
